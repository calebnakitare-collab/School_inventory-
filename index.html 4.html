<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Inventory</title>
<style>
:root{color-scheme:light dark;--bg:#eaf0f7;--card:#fff;--text:#1b2433;--muted:#5b687a;--accent:#1f6b4f;--accent-text:#fff;--line:#d3dce8;--bad:#b3392b;--bad-text:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1729;--card:#18233b;--text:#e6ecf5;--muted:#9aa9c0;--accent:#58c394;--accent-text:#0c1a13;--line:#26344f;--bad:#ff8a7a;--bad-text:#2a0a05}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 Georgia,"Times New Roman",serif}
h1,h2,button,input,select,label,.tab,.meta{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:18px;margin:0;font-weight:700}
main{max-width:680px;margin:0 auto;padding:12px 14px 80px}
nav{display:flex;gap:6px;margin:8px 0 14px}
.tab{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;font-size:15px}
.tab.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.row{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.row b{font-size:17px}.meta{color:var(--muted);font-size:13px}
.qty{font:700 22px system-ui,sans-serif;min-width:44px;text-align:right}
button{font-size:15px;padding:9px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-text);cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
input,select{width:100%;font-size:16px;padding:10px;margin:4px 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
label{font-size:13px;color:var(--muted)}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px}
summary{font:600 15px system-ui,sans-serif;color:var(--accent);cursor:pointer}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);width:min(92vw,420px)}
#login{max-width:360px;margin:12vh auto;padding:0 16px}
.err{color:var(--bad);font:14px system-ui,sans-serif;min-height:20px}
.empty{color:var(--muted);text-align:center;padding:24px}
.row.overdue{border-color:var(--bad);border-left-width:5px}
.row.soon{border-color:#d9a21b;border-left-width:5px}
.badge{display:inline-block;font:600 12px system-ui,sans-serif;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle}
.badge.overdue{background:var(--bad);color:var(--bad-text)}
.badge.soon{background:#d9a21b;color:#1b2433}
button.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
button.sm{padding:5px 10px;font-size:13px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<section id="login" hidden>
  <h1>School inventory</h1>
  <p class="meta">Staff sign-in</p>
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <button id="go" style="width:100%">Sign in</button>
</section>

<div id="app" hidden>
  <header><h1 id="sname">School inventory</h1><button class="ghost" id="out">Sign out</button></header>
  <main>
    <nav>
      <button class="tab on" data-t="items">Items</button>
      <button class="tab" data-t="students">Students</button>
      <button class="tab" data-t="loans">Loans</button>
    </nav>
    <div class="err" id="gerr"></div>

    <div id="items">
      <details><summary>Add item</summary><div style="margin-top:10px">
        <label>Name</label><input id="i_name">
        <label>Category</label><input id="i_cat" placeholder="Electronics, Furniture...">
        <label>Quantity</label><input id="i_qty" type="number" min="0" inputmode="numeric">
        <label>Condition</label><select id="i_cond"><option>good</option><option>fair</option><option>damaged</option></select>
        <label>Location</label><input id="i_loc">
        <label>Notes</label><input id="i_notes">
        <button id="i_save">Save item</button>
      </div></details>
      <input id="i_q" type="search" placeholder="Search items…"><div id="itemList"></div>
    </div>

    <div id="students" hidden>
      <details><summary>Add student</summary><div style="margin-top:10px">
        <label>Admission number</label><input id="s_id">
        <label>Name</label><input id="s_name">
        <label>Class</label><input id="s_class">
        <label>Guardian phone</label><input id="s_ph" type="tel">
        <button id="s_save">Save student</button>
      </div></details>
      <input id="s_q" type="search" placeholder="Search students…"><div id="studentList"></div>
    </div>

    <div id="loans" hidden><input id="l_q" type="search" placeholder="Search loans…"><div id="loanList"></div></div>
  </main>
</div>

<dialog id="lend">
  <h2 style="margin-top:0" id="lendTitle">Lend item</h2>
  <label>Student</label><select id="l_stu"></select>
  <label>Quantity</label><input id="l_qty" type="number" min="1" value="1" inputmode="numeric">
  <label>Due date</label><input id="l_due" type="date">
  <div class="err" id="l_err"></div>
  <div style="display:flex;gap:8px"><button id="l_ok">Lend item</button><button class="ghost" id="l_cancel">Cancel</button></div>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,deleteDoc,onSnapshot,setDoc,query,orderBy,runTransaction,serverTimestamp,Timestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDmltvK-JVrmci7OKnx-dlj_fcJ6a8QS8Y",
  authDomain: "school-inventory-254.firebaseapp.com",
  projectId: "school-inventory-254",
  appId: "1:663418258412:web:4303aae212be26221e76c9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app, "staff");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = t => t?.toDate ? t.toDate().toLocaleDateString() : "";
const fail = e => { $("gerr").textContent = e.code === "permission-denied" ? "Access denied. Check that your email has a staff document linked to a school." : e.message; };

let items = [], students = [], loans = [], unsubs = [], lendItem = null, schoolId = null, role = "viewer";
const isAdmin = () => role === "admin";
const norm = s => String(s ?? "").toLowerCase();
const hit = (q, ...f) => !q || f.some(x => norm(x).includes(q));

// Every school's data lives under schools/{schoolId}/...
const col = n => collection(db, "schools", schoolId, n);
const dref = (n, id) => doc(db, "schools", schoolId, n, id);
const noSchool = () => fail({message:"Your account isn't linked to a school yet."});

onAuthStateChanged(auth, async user => {
  unsubs.forEach(u => u()); unsubs = [];
  items = []; students = []; loans = []; schoolId = null; role = "viewer";
  renderItems(); renderStudents(); renderLoans();
  $("sname").textContent = "School inventory";
  $("login").hidden = !!user; $("app").hidden = !user;
  if (!user) return;
  $("gerr").textContent = "";

  let sid, r;
  try {
    const s = await getDoc(doc(db, "staff", user.email.toLowerCase()));
    if (auth.currentUser !== user) return;
    sid = s.exists() ? s.data().schoolId : null;
    r = s.exists() ? (s.data().role || "viewer") : "viewer";
  } catch(e) { return fail(e); }
  if (!sid) { $("gerr").textContent = "Your account isn't linked to a school yet. Ask the administrator."; return; }
  schoolId = sid; role = r;

  getDoc(doc(db, "schools", sid)).then(d => {
    if (schoolId === sid && d.exists() && d.data().name) $("sname").textContent = d.data().name;
  }).catch(() => {});

  unsubs.push(onSnapshot(col("inventory"), s => { items = s.docs.map(d => ({id:d.id,...d.data()})); renderItems(); }, fail));
  unsubs.push(onSnapshot(col("students"), s => { students = s.docs.map(d => ({id:d.id,...d.data()})); renderStudents(); }, fail));
  unsubs.push(onSnapshot(query(col("loans"), orderBy("dateIssued","desc")), s => { loans = s.docs.map(d => ({id:d.id,...d.data()})); renderLoans(); }, fail));
});

$("go").onclick = async () => {
  $("lerr").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("em").value.trim().toLowerCase(), $("pw").value); }
  catch { $("lerr").textContent = "Wrong email or password."; }
};
$("out").onclick = () => signOut(auth);

document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  ["items","students","loans"].forEach(t => $(t).hidden = t !== b.dataset.t);
});

function renderItems() {
  const q = norm($("i_q").value.trim());
  const list = items.filter(i => hit(q, i.name, i.category, i.location))
    .sort((a,b) => (a.name||"").localeCompare(b.name||""));
  $("itemList").innerHTML = list.length ? list.map(i => `
    <div class="row"><div><b>${esc(i.name)}</b><div class="meta">${esc(i.category)} · ${esc(i.location)} · ${esc(i.condition)}</div></div>
    <div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px"><div class="qty">${esc(i.quantity)}</div><button data-lend="${esc(i.id)}">Lend</button>${isAdmin() ? `<button class="danger sm" data-delitem="${esc(i.id)}">Delete</button>` : ""}</div></div>`).join("")
    : `<div class="empty">${items.length ? "No matches." : "No items yet. Tap Add item to start."}</div>`;
  document.querySelectorAll("[data-lend]").forEach(b => b.onclick = () => openLend(b.dataset.lend));
  document.querySelectorAll("[data-delitem]").forEach(b => b.onclick = () => delItem(b.dataset.delitem));
}
function renderStudents() {
  const q = norm($("s_q").value.trim());
  const list = students.filter(s => hit(q, s.name, s.id, s.class));
  $("studentList").innerHTML = list.length ? list.map(s => `
    <div class="row"><div><b>${esc(s.name)}</b><div class="meta">${esc(s.id)} · ${esc(s.class)} · ${esc(s.guardianPhone)}</div></div>${isAdmin() ? `<button class="danger sm" data-delstu="${esc(s.id)}">Delete</button>` : ""}</div>`).join("")
    : `<div class="empty">${students.length ? "No matches." : "No students yet. Tap Add student to start."}</div>`;
  document.querySelectorAll("[data-delstu]").forEach(b => b.onclick = () => delStudent(b.dataset.delstu));
}
function loanState(l) {
  if (l.status !== "issued" || !l.dueDate?.toDate) return {state:"", days:0};
  const d = l.dueDate.toDate();
  const due = new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 23, 59, 59, 999);
  const left = due - new Date();
  if (left < 0) return {state:"overdue", days:Math.ceil(-left / 864e5)};
  return {state: left < 2 * 864e5 ? "soon" : "", days:0};
}
function renderLoans() {
  const q = norm($("l_q").value.trim());
  const list = loans.filter(l => hit(q, l.itemName, l.studentName, l.studentId));
  $("loanList").innerHTML = list.length ? list.map(l => {
    const {state, days} = loanState(l);
    const badge = state === "overdue" ? `<span class="badge overdue">Overdue ${days}d</span>` : state === "soon" ? `<span class="badge soon">Due soon</span>` : "";
    const action = l.status === "issued" ? `<button data-ret="${esc(l.id)}">Return</button>`
      : `<div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px"><span class="meta">Returned</span>${isAdmin() ? `<button class="danger sm" data-delloan="${esc(l.id)}">Delete</button>` : ""}</div>`;
    return `<div class="row ${state}"><div><b>${esc(l.itemName)} × ${esc(l.quantity)}</b>${badge}
    <div class="meta">${esc(l.studentName)} (${esc(l.studentId)})<br>Issued ${fmt(l.dateIssued)} · Due ${fmt(l.dueDate)}${l.status==="returned" ? " · Returned "+fmt(l.returnDate) : ""}</div></div>
    ${action}</div>`;
  }).join("")
    : `<div class="empty">${loans.length ? "No matches." : "No loans recorded yet."}</div>`;
  document.querySelectorAll("[data-ret]").forEach(b => b.onclick = () => returnLoan(b.dataset.ret));
  document.querySelectorAll("[data-delloan]").forEach(b => b.onclick = () => delLoan(b.dataset.delloan));
}
$("i_q").oninput = renderItems;
$("s_q").oninput = renderStudents;
$("l_q").oninput = renderLoans;

$("i_save").onclick = async () => {
  if (!schoolId) return noSchool();
  const name = $("i_name").value.trim();
  if (!name) return fail({message:"Enter an item name."});
  try {
    await setDoc(doc(col("inventory")), {
      name, category:$("i_cat").value.trim(), quantity:Number($("i_qty").value)||0,
      condition:$("i_cond").value, location:$("i_loc").value.trim(), notes:$("i_notes").value.trim(),
      dateAdded:serverTimestamp()
    });
    ["i_name","i_cat","i_qty","i_loc","i_notes"].forEach(id => $(id).value = "");
    $("gerr").textContent = "";
  } catch(e) { fail(e); }
};

$("s_save").onclick = async () => {
  if (!schoolId) return noSchool();
  const id = $("s_id").value.trim();
  if (!id || id.includes("/")) return fail({message:"Enter an admission number without slashes."});
  try {
    await setDoc(dref("students", id), {name:$("s_name").value.trim(), class:$("s_class").value.trim(), guardianPhone:$("s_ph").value.trim()});
    ["s_id","s_name","s_class","s_ph"].forEach(x => $(x).value = "");
    $("gerr").textContent = "";
  } catch(e) { fail(e); }
};

function openLend(id) {
  lendItem = items.find(i => i.id === id);
  $("lendTitle").textContent = "Lend " + lendItem.name;
  $("l_stu").innerHTML = students.length ? students.map(s => `<option value="${esc(s.id)}">${esc(s.name)} (${esc(s.id)})</option>`).join("") : `<option value="">Add a student first</option>`;
  const d = new Date(); d.setDate(d.getDate()+7);
  $("l_due").value = d.toISOString().slice(0,10);
  $("l_qty").value = 1; $("l_err").textContent = "";
  $("lend").showModal();
}
$("l_cancel").onclick = () => $("lend").close();
$("l_ok").onclick = async () => {
  if (!schoolId) return $("l_err").textContent = "Your account isn't linked to a school yet.";
  const stu = students.find(s => s.id === $("l_stu").value);
  const qty = Number($("l_qty").value);
  if (!stu) return $("l_err").textContent = "Choose a student.";
  if (!(qty > 0)) return $("l_err").textContent = "Enter a quantity of 1 or more.";
  try {
    await runTransaction(db, async t => {
      const iref = dref("inventory", lendItem.id);
      const snap = await t.get(iref);
      const have = Number(snap.data().quantity);
      if (have < qty) throw new Error("Only " + have + " in stock.");
      t.update(iref, {quantity: have - qty});
      t.set(doc(col("loans")), {
        studentId:stu.id, studentName:stu.name, itemId:lendItem.id, itemName:lendItem.name, quantity:qty,
        dateIssued:serverTimestamp(), dueDate:Timestamp.fromDate(new Date($("l_due").value)),
        status:"issued", issuedBy:auth.currentUser.email
      });
    });
    $("lend").close();
  } catch(e) { $("l_err").textContent = e.message; }
};

async function delItem(id) {
  const it = items.find(i => i.id === id); if (!it) return;
  if (loans.some(l => l.itemId === id && l.status === "issued")) return fail({message:"Can't delete: some of this item is still on loan. Return it first."});
  if (!confirm(`Delete "${it.name}"? This can't be undone.`)) return;
  try { await deleteDoc(dref("inventory", id)); $("gerr").textContent = ""; } catch(e) { fail(e); }
}
async function delStudent(id) {
  const st = students.find(x => x.id === id); if (!st) return;
  if (loans.some(l => l.studentId === id && l.status === "issued")) return fail({message:"Can't delete: this student still has items on loan."});
  if (!confirm(`Delete "${st.name}" (${id})? This can't be undone.`)) return;
  try { await deleteDoc(dref("students", id)); $("gerr").textContent = ""; } catch(e) { fail(e); }
}
async function delLoan(id) {
  const l = loans.find(x => x.id === id); if (!l) return;
  if (l.status !== "returned") return fail({message:"Only returned loans can be deleted."});
  if (!confirm("Delete this returned loan record? This can't be undone.")) return;
  try { await deleteDoc(dref("loans", id)); $("gerr").textContent = ""; } catch(e) { fail(e); }
}

async function returnLoan(id) {
  try {
    await runTransaction(db, async t => {
      const lref = dref("loans", id);
      const l = await t.get(lref);
      if (l.data().status !== "issued") throw new Error("Already returned.");
      const iref = dref("inventory", l.data().itemId);
      const i = await t.get(iref);
      t.update(iref, {quantity: Number(i.data().quantity) + Number(l.data().quantity)});
      t.update(lref, {status:"returned", returnDate:serverTimestamp()});
    });
  } catch(e) { fail(e); }
}
</script>
</body>
</html>
